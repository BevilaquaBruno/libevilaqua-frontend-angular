<div class="grid-container">
  <h1 class="mat-h1">Editoras</h1>
  <p class="page-description">
    Gerencie as editoras disponíveis na biblioteca. Cada editora representa uma empresa responsável pela publicação dos livros.
  </p>
  <div class="content-wrapper">
    <div class="actions">
      <button matButton="outlined" class="rect-button" color="primary" (click)="openCreateForm()">
        <mat-icon>add</mat-icon>
        Nova Editora
      </button>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="(publishers$ | async) ?? []" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let publisher">{{ publisher.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let publisher">{{ publisher.name }}</td>
        </ng-container>

        <ng-container matColumnDef="country">
          <th mat-header-cell *matHeaderCellDef>País</th>
          <td mat-cell *matCellDef="let publisher">{{ publisher.country }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let publisher">
            <button mat-icon-button (click)="openEditForm(publisher)" title="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletePublisher(publisher)" title="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
