<div class="grid-container">
  <h1 class="mat-h1">Tags</h1>
  <p class="page-description">
    Gerencie as tags disponíveis na biblioteca. Cada tag representa uma palavra-chave ou categoria que pode ser associada aos itens.
  </p>
  <div class="content-wrapper">
    <div class="actions">
      <button matButton="outlined" class="rect-button" color="primary" (click)="openCreateForm()">
        <mat-icon>add</mat-icon>
        Nova Tag
      </button>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="(tags$ | async) ?? []" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let tag">{{ tag.id }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let tag">{{ tag.description }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let tag">
            <button mat-icon-button (click)="openEditForm(tag)" title="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteTag(tag)" title="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
