<div class="form-container">
  <div class="container">
    <div class="row">
      <div class="col-1-sm col-2"></div>
      <div class="col-10-sm col-8">
        <mat-card class="form-card">
          <mat-card-header>
            <mat-card-title>{{ title }}</mat-card-title>
            <mat-card-subtitle>
              {{ isEdit ? 'Edite as informações do tipo' : 'Preencha as informações para criar um novo tipo' }}
            </mat-card-subtitle>
          </mat-card-header>

          <mat-card-content>
            <form [formGroup]="typeForm" (ngSubmit)="onSubmit()">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Descrição</mat-label>
                <input matInput
                       #descriptionInput
                       formControlName="description"
                       placeholder="Digite a descrição do tipo"
                       required>
                <mat-error *ngIf="typeForm.get('description')?.hasError('required')">
                  Descrição é obrigatória
                </mat-error>
                <mat-error *ngIf="typeForm.get('description')?.hasError('minlength')">
                  Descrição deve ter pelo menos 1 caractere
                </mat-error>
                <mat-error *ngIf="typeForm.get('description')?.hasError('maxlength')">
                  Descrição deve ter no máximo 50 caracteres
                </mat-error>
              </mat-form-field>
            </form>
          </mat-card-content>

          <mat-card-actions align="end">
            <button mat-button type="button" (click)="onCancel()">
              Cancelar
            </button>
            <button mat-raised-button
                    color="primary"
                    type="submit"
                    (click)="onSubmit()"
                    [disabled]="typeForm.invalid || loading">
              <mat-icon *ngIf="loading">hourglass_empty</mat-icon>
              {{ submitButtonText }}
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
      <div class="col-1-sm col-2"></div>
    </div>
  </div>
</div>
