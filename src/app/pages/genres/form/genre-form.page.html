<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ title }}</mat-card-title>
      <mat-card-subtitle>
        {{
          isEdit
            ? 'Edite as informações do gênero'
            : 'Preencha as informações para criar um novo gênero'
        }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="genreForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Descrição</mat-label>
          <input
            matInput
            #descriptionInput
            formControlName="description"
            placeholder="Descrição do gênero"
            [disabled]="loading"
          />
          <mat-error *ngIf="genreForm.get('description')?.hasError('required')">
            Descrição é obrigatória
          </mat-error>
          <mat-error *ngIf="genreForm.get('description')?.hasError('minlength')">
            Descrição deve ter pelo menos 1 caractere
          </mat-error>
          <mat-error *ngIf="genreForm.get('description')?.hasError('maxlength')">
            Descrição não pode ter mais de 50 caracteres
          </mat-error>
        </mat-form-field>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancelar</button>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        (click)="onSubmit()"
        [disabled]="genreForm.invalid || loading"
      >
        <mat-icon *ngIf="loading">hourglass_empty</mat-icon>
        {{ submitButtonText }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
