<div class="grid-container">
  <h1 class="mat-h1">Autores</h1>
  <p class="page-description">Gerencie os autores cadastrados na biblioteca.</p>
  <div class="content-wrapper">
    <div class="actions">
      <button matButton="outlined" class="rect-button" color="primary" (click)="openCreateForm()">
        <mat-icon>add</mat-icon>
        Novo Autor
      </button>
    </div>
    <div class="table-container">
      <table mat-table [dataSource]="(authors$ | async) ?? []" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let author">{{ author.id }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let author">{{ author.name }}</td>
        </ng-container>
        <ng-container matColumnDef="birth_date">
          <th mat-header-cell *matHeaderCellDef>Nascimento</th>
          <td mat-cell *matCellDef="let author">{{ formatDate(author.birth_date) }}</td>
        </ng-container>
        <ng-container matColumnDef="death_date">
          <th mat-header-cell *matHeaderCellDef>Falecimento</th>
          <td mat-cell *matCellDef="let author">{{ formatDate(author.death_date) }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let author">
            <button mat-icon-button (click)="openEditForm(author)" title="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteAuthor(author)" title="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
